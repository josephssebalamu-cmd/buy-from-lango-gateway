name: Android Gateway

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      SMS_WEBHOOK_TOKEN: ${{ secrets.SMS_WEBHOOK_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test --reporter expanded

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=SMS_WEBHOOK_TOKEN=ci-only

      - name: Build configured release APK
        if: ${{ env.SMS_WEBHOOK_TOKEN != '' }}
        run: flutter build apk --release "--dart-define=SMS_WEBHOOK_TOKEN=$SMS_WEBHOOK_TOKEN"

      - name: Upload configured APK
        if: ${{ env.SMS_WEBHOOK_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: buy-from-lango-gateway-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error