name: Build Gateway App APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # Prevents hanging forever

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.GATEWAY_KEYSTORE_BASE64 }}
        # REMOVED 'gateway/' path prefix
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.GATEWAY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GATEWAY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GATEWAY_KEY_PASSWORD }}
        # REMOVED 'gateway/' path prefix
        run: |
          echo "storePassword=$KEYSTORE_PASSWORD" > key.properties
          echo "keyPassword=$KEY_PASSWORD" >> key.properties
          echo "keyAlias=$KEY_ALIAS" >> key.properties
          echo "storeFile=upload-keystore.jks" >> key.properties

      - name: Install Dependencies
        # REMOVED working-directory
        run: flutter pub get

      - name: Build APK
        # REMOVED working-directory
        run: flutter build apk --release

      - name: Upload Gateway APK
        uses: actions/upload-artifact@v4
        with:
          name: gateway-release-apk
          # REMOVED 'gateway/' path prefix
          path: build/app/outputs/flutter-apk/app-release.apk